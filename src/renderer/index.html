<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AURA-Sense</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="frame-chrome">
      <div class="frame-drag-region">
        <span>AURA-Sense</span>
      </div>
      <nav class="frame-controls" aria-label="Window controls">
        <button class="frame-button" type="button" id="pin-window" title="Toggle always on top" aria-label="Toggle always on top">Pin</button>
        <button class="frame-button" type="button" id="minimize-window" title="Minimize" aria-label="Minimize">_</button>
        <button class="frame-button danger" type="button" id="close-window" title="Close" aria-label="Close">X</button>
      </nav>
    </header>
    <main class="viewport" aria-label="AURA-Sense tactical viewport">
      <section class="combat-surface" aria-labelledby="combat-title">
        <div class="surface-header">
          <p class="eyebrow">Combat Witness</p>
          <h1 id="combat-title">Recent observations</h1>
          <p class="summary" id="combat-summary">Waiting for backend snapshot.</p>
        </div>
        <dl class="status-grid">
          <div>
            <dt>Signal</dt>
            <dd id="combat-signal">Unavailable</dd>
          </div>
          <div>
            <dt>5s incoming</dt>
            <dd id="incoming-5s">0</dd>
          </div>
          <div>
            <dt>15s repair</dt>
            <dd id="repair-15s">0</dd>
          </div>
          <div>
            <dt>Witnessed</dt>
            <dd id="event-count">0</dd>
          </div>
        </dl>
      </section>
      <section class="event-surface" aria-labelledby="events-title">
        <div class="section-title">
          <h2 id="events-title">Event stream</h2>
          <span id="runtime-health">Checking runtime</span>
        </div>
        <ul id="event-list" class="event-list"></ul>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
