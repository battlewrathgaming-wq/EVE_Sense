<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aura Core</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="frame-chrome">
      <div class="frame-drag-region">
        <span>Aura Core</span>
      </div>
      <nav class="frame-controls" aria-label="Window controls">
        <button class="frame-button" type="button" id="pin-window" title="Toggle always on top" aria-label="Toggle always on top">Pin</button>
        <button class="frame-button" type="button" id="minimize-window" title="Minimize" aria-label="Minimize">_</button>
        <button class="frame-button danger" type="button" id="close-window" title="Close" aria-label="Close">X</button>
      </nav>
    </header>
    <main class="shell">
      <section class="panel">
        <div>
          <p class="eyebrow">Aura Core</p>
          <h1>Seed shell ready</h1>
          <p class="summary">A neutral command surface for future Aura projects.</p>
        </div>
        <dl class="status-grid">
          <div>
            <dt>Runtime</dt>
            <dd id="health">Checking</dd>
          </div>
          <div>
            <dt>Commands</dt>
            <dd id="commands">0</dd>
          </div>
        </dl>
      </section>
      <section class="panel compact">
        <h2>Registered Services</h2>
        <ul id="service-list" class="service-list"></ul>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
